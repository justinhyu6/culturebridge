<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Culture Bridge globe</title>
  <link rel="stylesheet" href="./main.min.css">
  <style>
    @font-face { font-family: Geist; src: url('./Geist-Variable.woff2') format('woff2'); font-weight:100 900; font-display:swap; }
    * { box-sizing:border-box; }
    html,body { width:100%; height:100%; margin:0; overflow:hidden; background:#faf8f3; color:#17324d; font-family:Geist,system-ui,sans-serif; }
    #globe-container { width:100%; height:100%; }
    .country-marker { display:flex; flex-direction:column; align-items:center; border:0; padding:0; background:none; cursor:pointer; color:#17324d; font:650 11px/1.15 Geist,system-ui,sans-serif; white-space:nowrap; text-shadow:-1px -1px 2px #faf8f3,1px -1px 2px #faf8f3,-1px 1px 2px #faf8f3,1px 1px 2px #faf8f3; opacity:0; }
    .country-marker img { width:38px; height:38px; border:2px solid white; border-radius:50%; background:#e8d5b7; box-shadow:0 2px 6px #0005; transition:transform 160ms ease; }
    .country-marker:hover img,.country-marker:focus-visible img { transform:translateY(-2px) scale(1.08); }
    .country-marker:focus-visible { outline:2px solid #286b8f; outline-offset:3px; }
    .country-marker span { pointer-events:none; }
    #profile { position:fixed; z-index:20; left:8px; top:8px; width:min(420px,calc(100% - 16px)); max-height:calc(100% - 16px); overflow:auto; background:#faf8f3; border:1px solid #d4ddd8; border-radius:14px; box-shadow:0 7px 24px #17324d44; padding:10px; }
    #profile[hidden] { display:none; }
    .profile-header { display:flex; align-items:center; gap:10px; min-height:40px; }
    .profile-avatar { width:38px; height:38px; flex:none; border:2px solid white; border-radius:50%; background:#e8d5b7; box-shadow:0 2px 6px #0005; }
    .profile-country { display:flex; align-items:center; gap:7px; flex:1; min-width:0; }
    .profile-flag { width:25px; height:19px; object-fit:cover; border-radius:2px; }
    .profile-header h2 { margin:0; font-size:16px; }
    .profile-header button, .video-choice { border:0; border-radius:6px; padding:5px 9px; cursor:pointer; color:#17324d; background:#e9f0ed; font:inherit; }
    .profile-header button { font-size:20px; line-height:1; }
    #video-choices { display:flex; flex-wrap:wrap; gap:5px; margin:8px 0; }
    #video-choices:empty { display:none; }
    .video-choice { font-size:12px; }
    .video-choice[aria-pressed=true] { color:white; background:#17324d; }
    #player { display:block; width:min(100%, max(160px, calc(177.78vh - 258px))); height:auto; aspect-ratio:16/9; margin-inline:auto; border:0; border-radius:8px; background:#17324d; }
    #country-picker { position:fixed; z-index:10; left:8px; bottom:8px; width:auto; max-width:145px; border:1px solid #cbd6d0; border-radius:7px; background:#faf8f3ee; color:#17324d; padding:5px; font:600 11px Geist,system-ui,sans-serif; }
    #status { position:fixed; z-index:30; left:8px; top:8px; margin:0; background:#faf8f3; color:#17324d; }
  </style>
</head>
<body>
  <div id="globe-container" aria-label="Interactive globe with countries that have videos"></div>
  <label for="country-picker" style="position:absolute;left:-10000px">Choose a country with videos</label>
  <select id="country-picker" aria-label="Choose a country with videos"><option value="">Find a country</option></select>
  <p id="status" role="status" hidden></p>
  <section id="profile" aria-label="Country videos" hidden>
    <div class="profile-header"><img id="profile-avatar" class="profile-avatar" alt=""><div class="profile-country"><img id="profile-flag" class="profile-flag" alt=""><h2 id="profile-title"></h2></div><button id="close-profile" type="button" aria-label="Close videos">×</button></div>
    <div id="video-choices" aria-label="Choose a video"></div>
    <iframe id="player" title="Country video" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe>
  </section>
  <script src="./main.min.js"></script>
  <script>
  const globe = new BrandGlobe({
    container:'#globe-container', padding:0, overflow:0, scale:1,
    colors:{globe:'#ffffff',accent:'#f2dfca',stroke:'#004972'},
    globe:{opacity:1,shininess:14}, atmosphere:{enabled:false,altitude:0},
    rotation:{enabled:true,speed:0}, interaction:{enabled:true}, initialView:{lat:18,lng:18,altitude:1.7},
    polygons:{enabled:false}, arcs:{enabled:false}, points:{enabled:false}, rings:{enabled:false}, hubs:[], connections:[]
  });
  globe._effectiveAltitude = function () {
    const width=Math.max(1,globe.container.clientWidth), height=Math.max(1,globe.container.clientHeight);
    const angle=Math.atan(Math.tan(globe.globe.camera().fov*Math.PI/360)*Math.min(1,width/height)*0.98);
    return 1/Math.sin(angle)-1;
  };
  globe._resizeHandler();
  new ResizeObserver(()=>globe._resizeHandler()).observe(globe.container);
  const countries=topojson.feature(WORLD_TOPO,WORLD_TOPO.objects.countries).features;
  const canvas=document.createElement('canvas'); canvas.width=2048; canvas.height=1024;
  const ctx=canvas.getContext('2d'); ctx.fillStyle='#004972'; ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle='#f2dfca'; ctx.strokeStyle='#004972'; ctx.lineWidth=1;
  for (const feature of countries) {
    const polygons=feature.geometry.type==='Polygon'?[feature.geometry.coordinates]:feature.geometry.coordinates;
    for (const polygon of polygons) for (const shift of [-canvas.width,0,canvas.width]) {
      ctx.beginPath();
      for (const ring of polygon) {
        let previousX;
        ring.forEach(([lng,lat],index)=>{
          let x=(lng+180)/360*canvas.width;
          if (previousX!==undefined) { while(x-previousX>canvas.width/2)x-=canvas.width; while(x-previousX< -canvas.width/2)x+=canvas.width; }
          previousX=x; const y=(90-lat)/180*canvas.height;
          if(index===0)ctx.moveTo(x+shift,y);else ctx.lineTo(x+shift,y);
        });
        ctx.closePath();
      }
      ctx.fill('evenodd'); ctx.stroke();
    }
  }
  globe.globe.globeImageUrl(canvas.toDataURL());
  const profile=document.getElementById('profile'), player=document.getElementById('player');
  const picker=document.getElementById('country-picker'), choices=document.getElementById('video-choices');
  const flagCodes={Algeria:'dz',Nigeria:'ng',China:'cn',Indonesia:'id',Japan:'jp','North Korea':'kp',Philippines:'ph',Singapore:'sg','South Korea':'kr',Thailand:'th',Australia:'au',Denmark:'dk','United Kingdom':'gb',Germany:'de',Poland:'pl',Russia:'ru',Serbia:'rs',Sweden:'se',Netherlands:'nl',Mexico:'mx'};
  let currentCountry=null, currentMarker=null;
  function restoreMarker() {
    if (!currentMarker) return;
    const image=currentMarker.querySelector('img');
    image.style.visibility=''; image.style.transform='';
    currentMarker=null;
  }
  function positionProfile() {
    if(profile.hidden || !currentMarker) return;
    const markerImage=currentMarker.querySelector('img');
    const rect=markerImage.getBoundingClientRect();
    const width=profile.offsetWidth, height=profile.offsetHeight;
    const left=Math.max(8,Math.min(rect.left-10,innerWidth-width-8));
    const top=Math.max(8,Math.min(rect.top-10,innerHeight-height-8));
    profile.style.left=left+'px'; profile.style.top=top+'px';
  }
  window.addEventListener('resize',positionProfile);
  function selectVideo(entry,index) {
    player.src='https://drive.google.com/file/d/'+encodeURIComponent(entry.videos[index])+'/preview';
    player.title=entry.country+' video '+(index+1);
    choices.querySelectorAll('button').forEach((button,i)=>button.setAttribute('aria-pressed',String(i===index)));
  }
  function showCountry(entry,fly=false) {
    restoreMarker();
    currentCountry=entry; document.getElementById('profile-title').textContent=entry.country;
    document.getElementById('profile-avatar').src='./avatars/'+entry.avatar+'.svg';
    document.getElementById('profile-flag').src='./flags/'+flagCodes[entry.country]+'.svg';
    currentMarker=[...document.querySelectorAll('.country-marker')].find(marker=>marker.dataset.country===entry.country) || null;
    if(currentMarker) {
      const image=currentMarker.querySelector('img');
      image.style.transform=getComputedStyle(image).transform;
      image.style.visibility='hidden';
    }
    choices.replaceChildren();
    if(entry.videos.length>1) entry.videos.forEach((id,i)=>{
      const button=document.createElement('button'); button.className='video-choice'; button.type='button';
      button.textContent='Video '+(i+1); button.addEventListener('click',()=>selectVideo(entry,i)); choices.append(button);
    });
    selectVideo(entry,0); profile.hidden=false; picker.value=entry.country; positionProfile();
    if(fly) globe.globe.pointOfView({lat:entry.lat,lng:entry.lng,altitude:globe._effectiveAltitude()},700);
  }
  document.getElementById('close-profile').addEventListener('click',()=>{ profile.hidden=true; player.removeAttribute('src'); picker.value=''; currentCountry=null; restoreMarker(); });
  function updateVisibility() {
    const view=globe.globe.pointOfView(), radians=Math.PI/180;
    document.querySelectorAll('.country-marker').forEach(marker=>{
      const lat=Number(marker.dataset.lat)*radians, center=view.lat*radians, delta=(Number(marker.dataset.lng)-view.lng)*radians;
      const facing=Math.sin(lat)*Math.sin(center)+Math.cos(lat)*Math.cos(center)*Math.cos(delta);
      const rect=marker.getBoundingClientRect();
      const visible=facing>0.5 && rect.left>=0 && rect.right<=innerWidth && rect.top>=0 && rect.bottom<=innerHeight;
      marker.style.opacity=visible?'1':'0'; marker.style.pointerEvents=visible?'auto':'none'; marker.tabIndex=visible?0:-1;
    });
    positionProfile();
  }
  fetch('./videos.json').then(response=>{ if(!response.ok)throw new Error('Could not load the video list'); return response.json(); }).then(entries=>{
    entries.sort((a,b)=>a.country.localeCompare(b.country));
    for(const entry of entries) { const option=document.createElement('option'); option.value=entry.country; option.textContent=entry.country; picker.append(option); }
    picker.addEventListener('change',()=>{ const entry=entries.find(item=>item.country===picker.value); if(entry)showCountry(entry,true); });
    globe.globe.htmlElementsData(entries).htmlLat('lat').htmlLng('lng').htmlAltitude(0.012).htmlElement(entry=>{
      const marker=document.createElement('button'); marker.type='button'; marker.className='country-marker';
      marker.dataset.lat=entry.lat; marker.dataset.lng=entry.lng; marker.dataset.country=entry.country; marker.setAttribute('aria-label',entry.country+': '+entry.videos.length+' '+(entry.videos.length===1?'video':'videos'));
      const avatar=document.createElement('img'); avatar.src='./avatars/'+entry.avatar+'.svg'; avatar.alt='';
      const label=document.createElement('span'); label.textContent=entry.country; marker.append(avatar,label);
      marker.addEventListener('click',event=>{event.stopPropagation();showCountry(entry);}); return marker;
    });
    globe.globe.controls().addEventListener('change',updateVisibility); setInterval(updateVisibility,200); updateVisibility();
  }).catch(error=>{const status=document.getElementById('status');status.hidden=false;status.textContent='The video list could not be loaded.';console.error(error);});
  </script>
</body>
</html>
