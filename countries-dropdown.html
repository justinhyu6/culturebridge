<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Explore countries</title>
<style>
@font-face{font-family:Geist;src:url('./Geist-Variable.woff2') format('woff2');font-weight:100 900;font-display:swap}
*{box-sizing:border-box}body{margin:0;color:#17324d;font:14px Geist,system-ui,sans-serif;background:transparent}
button,input{font:inherit;color:inherit}button{cursor:pointer}
.search{display:block;width:100%;height:48px;padding:0 15px;border:1px solid #cbdad5;border-radius:10px;background:#fff;box-shadow:0 2px 8px #17324d0a;outline-color:#286b8f}
.search:hover{border-color:#286b8f}.menu{margin-top:6px;padding:10px;background:white;border:1px solid #d8e1de;border-radius:10px;box-shadow:0 8px 24px #17324d26}.menu[hidden]{display:none}
.list{overflow:auto;max-height:235px;margin-top:5px}.group{padding:9px 8px 4px;font-size:12px;font-weight:700;color:#637b73;text-transform:uppercase;letter-spacing:.05em}.country{display:flex;gap:9px;align-items:center;width:100%;padding:8px;border:0;border-radius:6px;background:transparent;text-align:left;font-weight:550}.country:hover,.country:focus-visible{background:#eef4f0;outline:2px solid #9db9ad;outline-offset:-2px}.flag{width:22px;height:16px;object-fit:cover;border-radius:2px}.empty{padding:12px;color:#526b64}
</style></head><body>
<input class="search" id="search" type="search" placeholder="Search countries" aria-label="Search countries" aria-expanded="false" aria-controls="menu" autocomplete="off">
<div class="menu" id="menu" hidden><div class="list" id="results" aria-live="polite"></div></div>
<script>
const regions={Algeria:'Africa',Nigeria:'Africa',China:'Asia',Indonesia:'Asia',Japan:'Asia','North Korea':'Asia',Philippines:'Asia',Singapore:'Asia','South Korea':'Asia',Thailand:'Asia',Australia:'Australia & Oceania',Denmark:'Europe','United Kingdom':'Europe',Germany:'Europe',Poland:'Europe',Russia:'Europe',Serbia:'Europe',Sweden:'Europe',Netherlands:'Europe',Mexico:'North America'};
const flags={Algeria:'dz',Nigeria:'ng',China:'cn',Indonesia:'id',Japan:'jp','North Korea':'kp',Philippines:'ph',Singapore:'sg','South Korea':'kr',Thailand:'th',Australia:'au',Denmark:'dk','United Kingdom':'gb',Germany:'de',Poland:'pl',Russia:'ru',Serbia:'rs',Sweden:'se',Netherlands:'nl',Mexico:'mx'};
const menu=document.getElementById('menu'),search=document.getElementById('search'),results=document.getElementById('results');let entries=[];
function setOpen(open){menu.hidden=!open;search.setAttribute('aria-expanded',String(open));window.parent.postMessage({type:'culturebridge:dropdown-size',open},'*')}
search.addEventListener('focus',()=>setOpen(true));search.addEventListener('click',()=>{if(menu.hidden)setOpen(true)});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!menu.hidden){setOpen(false);search.focus()}});window.addEventListener('blur',()=>setOpen(false));
function render(){const q=search.value.trim().toLowerCase(),groups=new Map();results.replaceChildren();for(const entry of entries){const region=regions[entry.country];if(!region||q&&!entry.country.toLowerCase().includes(q)&&!region.toLowerCase().includes(q))continue;if(!groups.has(region))groups.set(region,[]);groups.get(region).push(entry)}for(const [region,items] of [...groups].sort((a,b)=>a[0].localeCompare(b[0]))){const label=document.createElement('div');label.className='group';label.textContent=region;results.append(label);for(const entry of items.sort((a,b)=>a.country.localeCompare(b.country))){const button=document.createElement('button');button.type='button';button.className='country';const flag=document.createElement('img');flag.className='flag';flag.alt='';flag.src='./flags/'+flags[entry.country]+'.svg';const name=document.createElement('span');name.textContent=entry.country;button.append(flag,name);button.addEventListener('click',()=>{for(let i=0;i<window.parent.frames.length;i++){try{window.parent.frames[i].postMessage({type:'culturebridge:open',country:entry.country,index:0},location.origin)}catch(_){}}search.value='';render();setOpen(false);window.parent.postMessage({type:'culturebridge:country-selected'},'*')});results.append(button)}}if(!groups.size){const empty=document.createElement('div');empty.className='empty';empty.textContent='No matching countries found.';results.append(empty)}}
search.addEventListener('input',render);fetch('./videos.json').then(r=>{if(!r.ok)throw Error();return r.json()}).then(data=>{entries=data;render()}).catch(()=>{results.textContent='Countries could not be loaded.'});
</script></body></html>
